[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-oversight"
version = "0.1.0"
description = "A prototype action-review layer for AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "openai-agents",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
agent-oversight = "agent_oversight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_oversight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
